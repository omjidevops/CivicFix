# ============================================================================
# CIVICFIX BACKEND CONFIGURATION
# File: src/main/resources/application.properties
# ============================================================================

spring.application.name=civicfix-backend

# Server Configuration
# Running on port 8081 to avoid conflict with local port 8080 services (e.g., TNSLSNR)
server.port=8081

# ----------------------------------------------------------------------------
# 1. DEVELOPMENT IN-MEMORY DATABASE (Active for instant local execution)
# ----------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:civicfix;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ----------------------------------------------------------------------------
# 2. MYSQL PRODUCTION CONFIGURATION (Switch here once MySQL Server is running)
# Uncomment the block below and comment the H2 block to connect to MySQL:
# ----------------------------------------------------------------------------
# spring.datasource.url=jdbc:mysql://localhost:3306/civicfix?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# spring.datasource.username=${DB_USERNAME:root}
# spring.datasource.password=${DB_PASSWORD:root}
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# spring.jpa.hibernate.ddl-auto=update
